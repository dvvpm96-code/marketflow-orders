name: MP Manager checks

on:
  push:
    paths:
      - 'manager/**'
      - '.github/workflows/manager-checks.yml'
  pull_request:
    paths:
      - 'manager/**'
      - '.github/workflows/manager-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check manager/core.mjs
          node --check manager/server.mjs
          node --check manager/web/app.js
      - name: Check installer shell syntax
        run: bash -n manager/deploy/install-on-server.sh
      - name: Run manager tests (no marketplace credentials)
        run: node --test manager/manager.test.mjs
